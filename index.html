<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <h1>Tic-Tac-Toe</h1>
    <p class="subtitle">Click a square to play. X goes first.</p>
    <p class="author">by: <span class="author-name">Spyder</span></p>

    <div class="status-bar" id="status">Player X's turn</div>

    <div class="board" id="board">
      <button class="cell" data-cell="0"></button>
      <button class="cell" data-cell="1"></button>
      <button class="cell" data-cell="2"></button>
      <button class="cell" data-cell="3"></button>
      <button class="cell" data-cell="4"></button>
      <button class="cell" data-cell="5"></button>
      <button class="cell" data-cell="6"></button>
      <button class="cell" data-cell="7"></button>
      <button class="cell" data-cell="8"></button>
    </div>

    <button class="reset-button" id="resetButton">Reset Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
